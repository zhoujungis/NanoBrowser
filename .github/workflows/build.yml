# Everything that has to hold before a build is handed to anyone: the tests,
# the installer, and the version the installer reports.
#
# The version is never edited by hand. It is derived from the newest `vX.Y.Z`
# tag, raised one step, stamped into both files that carry it, committed, and
# released — so the number on the download page, in the installer, and in
# `--version` always agree.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

# a second run must not race the first one's version bump
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The checked-out tree carries a crates.io mirror that helps on a Chinese
      # network. GitHub's runners are not on that network, so the build goes to
      # crates.io directly.
      - name: Use crates.io instead of the local mirror
        working-directory: .
        shell: pwsh
        run: Remove-Item .cargo/config.toml -Force -ErrorAction SilentlyContinue

      - name: Run the test suite
        run: cargo test --locked

  ship:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          # the version comes from the tag history, so the whole history is needed
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ship

      - name: Use crates.io instead of the local mirror
        working-directory: .
        shell: pwsh
        run: Remove-Item .cargo/config.toml -Force -ErrorAction SilentlyContinue

      - name: Work out the next version
        id: version
        working-directory: .
        shell: pwsh
        run: |
          $last = git tag --list 'v*' |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            Sort-Object { [version]($_ -replace '^v', '') } |
            Select-Object -Last 1
          $v = if ($last) { $last.Substring(1) } else { '0.0.0' }
          $p = $v.Split('.') | ForEach-Object { [int]$_ }
          $bump = '${{ github.event.inputs.bump }}'
          if (-not $bump) { $bump = 'patch' }
          switch ($bump) {
            'major' { $p[0]++; $p[1] = 0; $p[2] = 0 }
            'minor' { $p[1]++; $p[2] = 0 }
            default { $p[2]++ }
          }
          $next = "$($p[0]).$($p[1]).$($p[2])"
          Write-Host "previous=$v next=$next bump=$bump"
          "version=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stamp the version into every file that reports it
        working-directory: src-tauri
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          # Cargo.toml: the package version, which `--version` prints. Only the
          # line that starts the key is touched, so dependency tables are safe.
          $cargo = Get-Content Cargo.toml -Raw
          $cargo = [regex]::Replace($cargo, '(?m)^version = "[^"]*"', 'version = "' + $v + '"')
          Set-Content Cargo.toml -Value $cargo -NoNewline
          # tauri.conf.json: the version the installer and the exe metadata carry
          $conf = Get-Content tauri.conf.json -Raw
          $conf = [regex]::Replace($conf, '(?m)^(\s*)"version": "[^"]*"(,?)', '${1}"version": "' + $v + '"${2}')
          Set-Content tauri.conf.json -Value $conf -NoNewline
          Write-Host '--- Cargo.toml ---'
          Select-String -Path Cargo.toml -Pattern '^version = '
          Write-Host '--- tauri.conf.json ---'
          Select-String -Path tauri.conf.json -Pattern '"version"'

      - name: Install the Tauri CLI
        # the bundler and the NSIS toolchain it downloads are the CLI's job
        working-directory: .
        shell: pwsh
        run: npm install -g @tauri-apps/cli@^2

      - name: Build the agent that ships beside the browser
        # the bundler takes the crate's other binary along as a sidecar, and it
        # refuses to run until that binary is already on disk
        run: cargo build --release --bin nanoagent

      - name: Bundle the installers
        shell: pwsh
        run: |
          # Both formats ship. NSIS installs per user without elevation, so it
          # stays the default download; the MSI is handed to Windows Installer,
          # which is what managed machines need when an endpoint agent refuses
          # to let an NSIS-style self-extracting installer start at all.
          tauri build --bundles nsis,msi

      - name: Record the installers
        id: installer
        working-directory: .
        shell: pwsh
        run: |
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $nsis -or -not $msi) { throw 'the bundler produced no installer' }
          foreach ($f in @($nsis, $msi)) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
            Write-Host "$($f.Name)  $([math]::Round($f.Length / 1MB, 2)) MiB  sha256=$h"
          }
          "nsis_path=$($nsis.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "nsis_name=$($nsis.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "nsis_sha256=$((Get-FileHash $nsis.FullName -Algorithm SHA256).Hash)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "msi_path=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "msi_name=$($msi.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "msi_sha256=$((Get-FileHash $msi.FullName -Algorithm SHA256).Hash)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: NanoBrowser-${{ steps.version.outputs.version }}-installers
          path: |
            ${{ steps.installer.outputs.nsis_path }}
            ${{ steps.installer.outputs.msi_path }}
          if-no-files-found: error

      # Pushing with the workflow token is deliberate: GitHub does not start a
      # run for commits it makes itself, so the bump cannot trigger a rebuild.
      - name: Commit the version bump
        working-directory: .
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push

      - name: Publish the release
        working-directory: .
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $notes = @"
          Windows installers for NanoBrowser $v, built by the tests that ran on this commit.

          They install **NanoBrowser**, the browser, and ship **nanoagent** — the headless
          automation browser that speaks MCP — alongside it.

          If ``setup.exe`` does nothing at all (no window, nothing installed), a managed
          machine is blocking NSIS-style self-extracting installers. Use the **.msi**
          instead: it hands the work to Windows Installer, which those agents leave
          alone, and it asks for administrator approval once through the usual UAC prompt.

          ``${{ steps.installer.outputs.nsis_name }}``
          SHA256: ``${{ steps.installer.outputs.nsis_sha256 }}``

          ``${{ steps.installer.outputs.msi_name }}``
          SHA256: ``${{ steps.installer.outputs.msi_sha256 }}``
          "@
          gh release create "v$v" `
            "${{ steps.installer.outputs.nsis_path }}" `
            "${{ steps.installer.outputs.msi_path }}" `
            --title "NanoBrowser v$v" `
            --notes $notes `
            --generate-notes
