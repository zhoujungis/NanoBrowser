[package]
name = "nanobrowser"
version = "0.0.2"
description = "NanoBrowser - an ultra-light Chrome-style browser"
edition = "2021"
# the browser is the product; nanoagent rides along as a bundled sidecar
default-run = "nanobrowser"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
