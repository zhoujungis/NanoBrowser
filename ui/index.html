  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><ellipse cx="12" cy="12" rx="4" ry="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path stroke="currentColor" stroke-width="1.7" d="M3 12h18"/></symbol>

<div id="shell">
  <div id="tabstrip" data-tauri-drag-region>
    <div id="tabs" data-tauri-drag-region></div>
    <button id="newtab" title="新建标签页 (Ctrl+T)"><svg class="ic16"><use href="#i-plus"/></svg></button>
    <div id="strip-spacer" data-tauri-drag-region></div>
    <div id="winctl">
      <button id="win-min" title="最小化"><svg class="cap"><use href="#i-minus"/></svg></button>
      <button id="win-max" title="最大化"><svg class="cap"><use href="#i-max"/></svg></button>
      <button id="win-close" title="关闭"><svg class="cap"><use href="#i-close"/></svg></button>
    </div>
  </div>

  <div id="toolbar">
    <button class="tbtn" id="btn-back" title="后退 (Alt+←)"><svg class="ic18"><use href="#i-back"/></svg></button>
    <button class="tbtn" id="btn-fwd" title="前进 (Alt+→)"><svg class="ic18"><use href="#i-forward"/></svg></button>
    <button class="tbtn" id="btn-reload" title="刷新 (F5)；右键查看更多"><svg class="ic18"><use href="#i-reload"/></svg></button>
    <button class="tbtn" id="btn-home" title="主页"><svg class="ic18"><use href="#i-home"/></svg></button>

    <div id="omnibox">
      <span id="omni-sec"><svg class="ic16"><use href="#i-lock"/></svg></span>
      <input id="omni-input" spellcheck="false" autocomplete="off" placeholder="搜索或输入网址">
      <button id="omni-star" title="收藏 (Ctrl+D)"><svg class="ic16"><use href="#i-star"/></svg></button>
      <div id="omni-drop"></div>
    </div>

    <button class="tbtn" id="btn-downloads" title="下载内容 (Ctrl+J)"><svg class="ic18"><use href="#i-downloads"/></svg></button>
    <button class="tbtn" id="btn-menu" title="菜单"><svg class="ic18"><use href="#i-menu"/></svg></button>
  </div>

  <div id="bookmarkbar" hidden></div>

  <div id="findbar" hidden>
    <input id="find-input" spellcheck="false" placeholder="查找">
    <span id="find-count"></span>
    <button class="tbtn" id="find-prev" title="上一个 (Shift+Enter)"><svg class="ic18"><use href="#i-up"/></svg></button>
    <button class="tbtn" id="find-next" title="下一个 (Enter)"><svg class="ic18"><use href="#i-down2"/></svg></button>
    <button class="tbtn" id="find-close" title="关闭 (Esc)"><svg class="ic18"><use href="#i-close"/></svg></button>
  </div>

  <div id="status-bubble" hidden></div>
  <div id="menu-layer" hidden>
    <div id="main-menu" class="menu"></div>
    <div id="reload-menu" class="menu"></div>
    <div id="tab-menu" class="menu"></div>
    <div id="bm-menu" class="menu"></div>
    <div id="bm-overflow" class="menu"></div>
  </div>
</div>
<script src="shell.js"></script>
</body>
</html>
